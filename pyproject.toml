[project]
name = "long-running-agents-lab"
version = "0.1.0"
description = "CHANGE ME — one line about the show. An interactive one-page lab on ADK: three chapters, one agent, one edit."
requires-python = ">=3.11"
dependencies = [
    "google-adk==2.9.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["agent", "lab"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
